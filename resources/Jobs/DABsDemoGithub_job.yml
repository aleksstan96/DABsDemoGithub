# Minimal job for the CI/CD demo: one notebook task on serverless compute.
# The point of this repo is the GitHub Actions + WIF deploy story --
# the workload itself is intentionally trivial.
resources:
  jobs:
    DABsDemoGithub_job:
      name: DABsDemoGithub_job

      email_notifications:
        on_failure:
          - aleksandra.stanojevic@databricks.com

      tasks:
        - task_key: hello_notebook
          notebook_task:
            notebook_path: ../../src/notebook.ipynb
