name: Deploy bundle (prod)

# Push to main -> deploy bundle to the prod target and refresh the DLT pipeline.
# Auths via GitHub OIDC federation -- no PATs in repo secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual re-runs from the Actions tab for demos

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: bundle deploy
    runs-on: ubuntu-latest
    environment: prod  # GitHub Environment scopes OIDC subject; matches federation policy
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_prod_sp_app_id: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Confirm OIDC auth works
        run: databricks current-user me

      - name: Deploy bundle
        run: databricks bundle deploy --target prod

  run-pipeline:
    name: refresh DLT pipeline
    runs-on: ubuntu-latest
    needs: deploy
    environment: prod
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_prod_sp_app_id: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle run DABsDemoGithub_pipeline --refresh-all --target prod
