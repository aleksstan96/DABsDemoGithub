# Databricks Asset Bundle: DABsDemoGithub
# CI/CD demo -- GitHub Actions deploys this bundle via Workload Identity
# Federation (no PAT secrets). See .github/workflows/.
bundle:
  name: DABsDemoGithub

include:
  - resources/*/*.yml

variables:
  prod_sp_app_id:
    description: Application ID of the Databricks SP that owns + runs the prod deployment.
    default: "98567142-f414-459b-b56d-7d5fdb6fa141"

targets:
  # Local development. `mode: development` prefixes resources with [dev <user>]
  # and pauses schedules so multiple developers can coexist.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405612459259588.8.azuredatabricks.net/

  # Deployed by GitHub Actions on push to main. Auths via GitHub OIDC.
  prod:
    mode: production
    workspace:
      host: https://adb-7405612459259588.8.azuredatabricks.net/
      # SPs don't have /Users/<sp> dirs, so pin root_path to a user-owned location.
      root_path: /Users/aleksandra.stanojevic@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.prod_sp_app_id}
    permissions:
      - user_name: aleksandra.stanojevic@databricks.com
        level: CAN_MANAGE
